# CI: Editor bauen und testen
name: Editor

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix editor
      - run: npm run editor:build

      - name: Editor starten (Kurztest)
        run: |
          npm run editor:start &
          sleep 6
          curl -sf http://localhost:3001/ && echo "Server OK" || true
          pkill -f "node.*server/dist" 2>/dev/null || true
